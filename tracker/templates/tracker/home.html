{% extends 'tracker/base.html' %}

{% block title %}Xush kelibsiz{% endblock %}

{% block content %}
<div class="icon">📸</div>
<h1>Xush kelibsiz</h1>
<p>Sizga berilgan havolani shu yerga qo'ying</p>

<form method="GET">
    <input type="text" name="link" placeholder="Havolani kiriting..." value="{{ request.GET.link }}" required>
    {% if error %}
        <p style="color: #ef4444; font-size: 14px; text-align: left; margin-top: -15px; margin-bottom: 15px;">{{ error }}</p>
    {% endif %}
    <button type="submit" class="btn">Davom etish</button>
</form>
{% endblock %}

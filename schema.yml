openapi: 3.0.3
info:
  title: InstaChecker API
  version: 1.0.0
  description: Instagram Reels Tracker & Prize System API
paths:
  /api/admin/create-user/:
    post:
      operationId: api_admin_create_user_create
      description: 'Faqat admin uchun: Yangi foydalanuvchi (Django User + InstagramUser)
        yaratish.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreateUserOutput'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/export/posts.csv:
    get:
      operationId: api_admin_export_posts.csv_retrieve
      description: |-
        Admin: Filtrga mos postlarni oqimli (StreamingHttpResponse) CSV qilib eksport qilish.
        Katta ma'lumotlarda xotirani to'ldirmaydi.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/posts/:
    get:
      operationId: api_admin_posts_retrieve
      description: |-
        Admin: Filtr (status, sana oralig'i, user), saralash (views), pagination bilan postlar ro'yxati.
        O'chirilgan postlar va deleted_detected_at ko'rinadi.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/reset-password/:
    post:
      operationId: api_admin_reset_password_create
      description: 'Faqat admin uchun: istalgan userning parolini tiklash.'
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/stats/daily/:
    get:
      operationId: api_admin_stats_daily_retrieve
      description: 'Admin: Kunlar bo''yicha yangi postlar va jami views (grafik uchun).'
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/summary/:
    get:
      operationId: api_admin_summary_retrieve
      description: Admin uchun umumiy statistika (Redis keshda 60 soniya saqlanadi).
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSummary'
          description: ''
  /api/admin/users/:
    get:
      operationId: api_admin_users_retrieve
      description: |-
        Admin: Har user bo'yicha statistika (postlar, views, likes, comments, oxirgi post sanasi, holati),
        qidiruv, filtr, saralash va pagination bilan. N+1 yo'q.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/users/{user_id}/:
    get:
      operationId: api_admin_users_retrieve_2
      description: 'Admin: Foydalanuvchi tafsilotlari va uning postlari / statistikasi
        tarixi.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/change-password/:
    post:
      operationId: api_change_password_create
      description: Oddiy user yoki admin o'z parolini eski parolni kiritish orqali
        yangilaydi.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/dashboard/:
    get:
      operationId: api_dashboard_retrieve
      description: Admin uchun umumiy statistika (Redis keshda 60 soniya saqlanadi).
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSummary'
          description: ''
  /api/data-deletions/:
    get:
      operationId: api_data_deletions_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataDeletionRequestList'
          description: ''
  /api/data-deletions/{id}/:
    get:
      operationId: api_data_deletions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this data deletion request.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeletionRequest'
          description: ''
  /api/dev/simulate-delete/:
    post:
      operationId: api_dev_simulate_delete_create
      description: 'Faqat DRY_RUN rejimida: Instagram''da post o''chirilganini (Code
        100/33 yoki 404) simulyatsiya qilish va tekshiruv quvurini ishga tushirish.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePostActionInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulatePostActionInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulatePostActionInputRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/dev/simulate-network-error/:
    post:
      operationId: api_dev_simulate_network_error_create
      description: 'Faqat DRY_RUN rejimida: Instagram vaqtinchalik tarmoq/server xatosini
        simulyatsiya qilish.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePostActionInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulatePostActionInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulatePostActionInputRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/dev/simulate-token-revoked/:
    post:
      operationId: api_dev_simulate_token_revoked_create
      description: 'Faqat DRY_RUN rejimida: Instagram foydalanuvchi tokeni bekor qilinganini
        (Code 190) simulyatsiya qilish.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateUserActionInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulateUserActionInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulateUserActionInputRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/dev/simulate-views/:
    post:
      operationId: api_dev_simulate_views_create
      description: 'Faqat DRY_RUN rejimida: Post ko''rishlarini Instagram''da simulyatsiya
        qilish va haqiqiy tekshiruv quvurini (prizlar, statistika) ishga tushirish.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateViewsInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulateViewsInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulateViewsInputRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: Tizim holatini (Database, Redis va DRY_RUN rejimi) tekshirish.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckOutput'
          description: ''
  /api/links/:
    get:
      operationId: api_links_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - opened
          - pending
          - posted
        description: |-
          * `pending` - Pending
          * `opened` - Opened
          * `posted` - Posted
          * `failed` - Failed
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUniqueLinkList'
          description: ''
    post:
      operationId: api_links_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniqueLinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UniqueLinkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UniqueLinkRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniqueLink'
          description: ''
  /api/links/{id}/:
    get:
      operationId: api_links_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this unique link.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniqueLink'
          description: ''
    put:
      operationId: api_links_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this unique link.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniqueLinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UniqueLinkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UniqueLinkRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniqueLink'
          description: ''
    patch:
      operationId: api_links_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this unique link.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUniqueLinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUniqueLinkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUniqueLinkRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniqueLink'
          description: ''
    delete:
      operationId: api_links_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this unique link.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/links/{id}/resend/:
    post:
      operationId: api_links_resend_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this unique link.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniqueLinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UniqueLinkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UniqueLinkRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniqueLink'
          description: ''
  /api/me/:
    get:
      operationId: api_me_retrieve
      description: Joriy tizimga kirgan foydalanuvchi ma'lumotlari va roli (/api/me/).
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOutput'
          description: ''
  /api/me/notifications/:
    get:
      operationId: api_me_notifications_retrieve
      description: Foydalanuvchining bildirishnomalari va o'qilmaganlar soni.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/me/notifications/read/:
    post:
      operationId: api_me_notifications_read_create
      description: Bildirishnomani o'qilgan deb belgilash (bitta yoki barchasini).
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/me/posts/:
    get:
      operationId: api_me_posts_retrieve
      description: Foydalanuvchining o'z postlari (pagination bilan).
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/me/posts/{post_id}/history/:
    get:
      operationId: api_me_posts_history_retrieve
      description: PostStat tarixi (grafik uchun, vaqt bo'yicha o'sish tartibida).
      parameters:
      - in: path
        name: post_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/me/prizes/:
    get:
      operationId: api_me_prizes_retrieve
      description: Foydalanuvchining sovrinlari.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/me/summary/:
    get:
      operationId: api_me_summary_retrieve
      description: |-
        Faqat joriy foydalanuvchining o'z statistikasi:
        jami views, like, comment, postlar soni, prizlar soni, oxirgi tekshiruv vaqti.
        BOSQICH A: progress va milestone ma'lumotlari bilan qaytadi.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSummary'
          description: ''
  /api/notifications/:
    get:
      operationId: api_notifications_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query

components:
  schemas:
    AdminCreateUserOutput:
      type: object
      properties:
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        instagram_user:
          allOf:
          - $ref: '#/components/schemas/InstagramUser'
          readOnly: true
      required:
      - instagram_user
      - is_staff
      - role
      - user_id
      - username
    AdminCreateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
        is_staff:
          type: boolean
          default: false
        ig_user_id:
          type: string
          default: ''
          maxLength: 100
      required:
      - name
      - password
      - username
    AdminSummary:
      type: object
      properties:
        total_users:
          type: integer
        connected_users:
          type: integer
        needs_reauth_users:
          type: integer
        posts_by_status:
          type: object
          additionalProperties:
            type: integer
        total_metrics:
          type: object
          additionalProperties:
            type: integer
        total_views:
          type: integer
        total_likes:
          type: integer
        total_comments:
          type: integer
        total_prizes:
          type: integer
        expiring_tokens_count:
          type: integer
        users_by_status:
          type: object
          additionalProperties:
            type: integer
        links_by_status:
          type: object
          additionalProperties:
            type: integer
        instagram_errors_last_hour:
          type: object
          additionalProperties:
            type: integer
        dry_run:
          type: boolean
          default: false
      required:
      - connected_users
      - expiring_tokens_count
      - links_by_status
      - needs_reauth_users
      - posts_by_status
      - total_comments
      - total_likes
      - total_metrics
      - total_prizes
      - total_users
      - total_views
      - users_by_status
    CustomTokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    DataDeletionRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        confirmation_code:
          type: string
          readOnly: true
        user_id:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DataDeletionStatusEnum'
          readOnly: true
        requested_at:
          type: string
          format: date-time
          readOnly: true
        details:
          type: string
          readOnly: true
          nullable: true
      required:
      - confirmation_code
      - details
      - id
      - requested_at
      - status
      - user_id
    DataDeletionStatusEnum:
      enum:
      - pending
      - completed
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `failed` - Failed
    HealthCheckOutput:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        redis:
          type: string
        dry_run:
          type: boolean
      required:
      - database
      - dry_run
      - redis
      - status
    InstagramUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        username:
          type: string
          readOnly: true
          default: ''
        name:
          type: string
          maxLength: 255
        ig_user_id:
          type: string
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/InstagramUserStatusEnum'
          readOnly: true
        role:
          type: string
          readOnly: true
        token_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        has_token:
          type: string
          readOnly: true
      required:
      - created_at
      - has_token
      - id
      - ig_user_id
      - name
      - role
      - status
      - token_expires_at
      - username
    InstagramUserRequest:
      type: object
      properties:
        user:
          type: integer
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    InstagramUserStatusEnum:
      enum:
      - pending
      - connected
      - needs_reauth
      type: string
      description: |-
        * `pending` - Pending
        * `connected` - Connected
        * `needs_reauth` - Needs Reauth
    KindEnum:
      enum:
      - prize
      - system
      type: string
      description: |-
        * `prize` - Prize
        * `system` - System
    MeSummary:
      type: object
      properties:
        total_views:
          type: integer
          default: 0
        total_likes:
          type: integer
          default: 0
        total_comments:
          type: integer
          default: 0
        posts_count:
          type: integer
          default: 0
        prizes_count:
          type: integer
          default: 0
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        next_milestone:
          type: integer
          nullable: true
        views_remaining:
          type: integer
          nullable: true
        progress_percent:
          type: number
          format: double
          default: 0.0
        milestones:
          type: array
          items:
            type: integer
      required:
      - last_checked_at
      - milestones
      - next_milestone
      - views_remaining
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        message:
          type: string
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        related_prize:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - is_read
      - kind
      - message
      - related_prize
      - user
    PaginatedDataDeletionRequestList:
      type: object
      required:
      - count
      - results
      properties:

services:
  db:
    image: postgres:15-alpine
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine

  web:
    build: .
    command: /app/entrypoint.sh
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/static
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - INSTAGRAM_DRY_RUN=${INSTAGRAM_DRY_RUN:-${DRY_RUN:-True}}
      - DRY_RUN_PUBLISH_DELAY_SECONDS=${DRY_RUN_PUBLISH_DELAY_SECONDS:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    # gevent yoki yuqori concurrency bilan ishlash tavsiya etiladi (masalan: -P gevent yoki --concurrency 16)
    command: celery -A config worker -l info --concurrency 16
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file: .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - INSTAGRAM_DRY_RUN=${INSTAGRAM_DRY_RUN:-${DRY_RUN:-True}}
      - DRY_RUN_PUBLISH_DELAY_SECONDS=${DRY_RUN_PUBLISH_DELAY_SECONDS:-0}
    depends_on:
      - redis
      - db

  beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file: .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - INSTAGRAM_DRY_RUN=${INSTAGRAM_DRY_RUN:-${DRY_RUN:-True}}
      - DRY_RUN_PUBLISH_DELAY_SECONDS=${DRY_RUN_PUBLISH_DELAY_SECONDS:-0}
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/app/media
      - static_volume:/app/static
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - web

  newman:
    image: postman/newman:alpine
    profiles:
      - e2e
    volumes:
      - ./postman:/etc/newman
    working_dir: /etc/newman
    command:
      - run
      - insta_checker.postman_collection.json
      - -e
      - local.postman_environment.json
      - --env-var
      - base_url=http://web:8000
      - --env-var
      - admin_username=admin
      - --env-var
      - admin_password=admin123
      - --env-var
      - user_username=bekzod
      - --env-var
      - user_password=user123
      - --working-dir
      - /etc/newman
      - --bail
    depends_on:
      - web

volumes:
  postgres_data:
  media_volume:
  static_volume:
